name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # NOTE: trivy-action is pinned to the full commit SHA of v0.35.0, the release
  # that remained safe after the March 2026 compromise of trivy-action tags
  # (GHSA-69fq-xp46-6x23). Never reference this action by a mutable tag or branch.
  # Its default Trivy binary is v0.69.3. Review release notes before updating.
  # Every other action is pinned to a full commit SHA too, with the release
  # version in a trailing comment. Update them deliberately, not via floating tags.

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install dev tools (pinned in requirements-dev.txt)
        run: pip install -r requirements-dev.txt

      - name: Run flake8
        run: flake8 app.py tests/ --max-line-length=100 --extend-ignore=E501

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install dev tools (pinned in requirements-dev.txt)
        run: pip install -r requirements-dev.txt

      - name: Run Bandit SAST scan
        run: bandit -r app.py -f screen --severity-level medium

  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: Dependency Scan (Trivy)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: [sast, secret-scan, dependency-scan]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image for DAST
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: false
          load: true
          tags: dast-scan:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container (same hardening as production)
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          docker run -d --name dast-app \
            --read-only \
            --tmpfs /tmp \
            -p 5000:5000 \
            -e API_KEY \
            dast-scan:latest

      - name: Wait for the app to be healthy
        run: |
          for i in $(seq 1 30); do
            curl -fs http://localhost:5000/health && exit 0
            sleep 2
          done
          echo "App did not become healthy in time"
          docker logs dast-app
          exit 1

      - name: Run ZAP baseline scan
        run: |
          mkdir -p zap-out
          cp .zap/rules.tsv zap-out/rules.tsv
          chmod -R a+rw zap-out
          docker run --rm --network host \
            -v "$PWD/zap-out:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:2.17.0 \
            zap-baseline.py \
              -t http://localhost:5000 \
              -c rules.tsv \
              -r zap-report.html \
              -J zap-report.json \
              -I

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-report
          path: zap-out/zap-report.*

      - name: Stop container
        if: always()
        run: docker rm -f dast-app

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [sast, secret-scan, dependency-scan, dast]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      # The image is built once. The same image is scanned, smoke tested, and
      # then pushed, so what is published is exactly what was checked.
      - name: Build image locally for scanning
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: false
          load: true
          tags: local-scan:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local-scan:latest
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

      - name: Smoke test secret injection (API_KEY from GitHub Secrets)
        if: github.event_name == 'push'
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          docker run -d --name secret-smoke-test \
            --read-only \
            --tmpfs /tmp \
            -p 5000:5000 \
            -e API_KEY \
            local-scan:latest
          sleep 5
          RESPONSE=$(curl -sf http://localhost:5000/config-status)
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"api_key_configured":true' || \
            (echo "API_KEY was not picked up by the container" && exit 1)
          # The in-memory store must behave the same on every request. This
          # fails if the container is ever run with more than one worker.
          curl -sf -X POST http://localhost:5000/items \
            -H 'Content-Type: application/json' \
            -d '{"name":"smoke"}' > /dev/null
          for i in 1 2 3 4 5 6 7 8; do
            curl -sf http://localhost:5000/items/1 > /dev/null || \
              (echo "In-memory state is not shared across requests" && exit 1)
          done
          docker logs secret-smoke-test
          docker stop secret-smoke-test

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the exact image that was scanned (only after passing security scans)
        if: github.event_name == 'push'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag local-scan:latest "$tag"
            docker push "$tag"
          done
