# Local monitoring stack. Not used in the CI/CD pipeline itself — this is
# for running the app with real-time metrics visibility on your own machine.
#
# Usage:
#   docker compose up --build
#   App:        http://localhost:5000
#   Prometheus: http://localhost:9090
#   Metrics:    http://localhost:5000/metrics

services:
  app:
    build: .
    ports:
      # Bound to localhost only, so the demo is not reachable from the network
      - "127.0.0.1:5000:5000"
    environment:
      - API_KEY=local-dev-value
    read_only: true
    tmpfs:
      - /tmp

  prometheus:
    image: prom/prometheus:v3.15.1
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app
